# VOICEVOX API設定
voicevox:
  base_url: "http://localhost:50021"
  timeout: 30  # 1リクエストあたりのタイムアウト（秒）

# 話者マッピング
# speaker_id はVOICEVOXの /speakers エンドポイントで確認可能
speakers:
  山田太郎:
    speaker_id: 3    # ずんだもん（ノーマル）- 管理者
    speed_scale: 1.0
    pitch_scale: 0.0
  佐藤花子:
    speaker_id: 2    # 四国めたん（ノーマル）- 介護士
    speed_scale: 1.0
    pitch_scale: 0.0
  加藤二郎:
    speaker_id: 8    # 春日部つむぎ（ノーマル）- 介護士/看護師
    speed_scale: 1.0
    pitch_scale: 0.0

# デフォルト話者（マッピングにない話者名の場合に使用）
default_speaker:
  speaker_id: 3
  speed_scale: 1.0
  pitch_scale: 0.0

# 音声生成設定
audio:
  silence_between_lines: 0.8      # 発言間の無音（秒）
  silence_between_sections: 2.0   # セクション区切りの無音（秒）
  sample_rate: 24000              # VOICEVOXのデフォルトサンプルレート
  output_format: "mp3"            # wav または mp3
  mp3_quality: 2                  # ffmpeg -qscale:a の値（0=最高品質, 9=最低）
